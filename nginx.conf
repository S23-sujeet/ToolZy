# Serves the built dist/ output with SPA fallback so client-side routes
# (e.g. /tools/merge-pdf) work on a hard refresh or direct link.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed build assets aggressively; never cache the HTML shell.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback: unknown paths (client-side routes) resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
